[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "gemini-web-mcp"
version = "0.1.0"
description = "Plug-and-play Playwright/Patchright MCP server wrapping gemini.google.com with persistent browser profile, model switching, and file uploads."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Ridlo Abelian" }
]
keywords = ["mcp", "gemini", "playwright", "patchright", "model-context-protocol", "browser-automation"]
dependencies = [
  "mcp[cli]>=1.6.0",
  "patchright>=1.50.0",
  "playwright>=1.50.0",
  "pydantic>=2.7.0",
  "starlette>=0.40.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.7.0",
]

[project.scripts]
gemini-web-mcp = "gemini_web_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_web_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
