<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="gemini-web-mcp system architecture">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <pattern id="archGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.45"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="430" rx="18" fill="url(#archBg)"/>
  <rect x="0" y="0" width="1200" height="430" rx="18" fill="url(#archGrid)"/>
  <rect x="1" y="1" width="1198" height="428" rx="17" fill="none" stroke="#1E293B" stroke-width="2"/>

  <text x="48" y="42" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.4">END-TO-END ARCHITECTURE</text>
  <text x="48" y="72" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800">How AI Agents Automate gemini.google.com Reliably</text>

  <rect x="44" y="104" width="232" height="286" rx="14" fill="#0D1526" stroke="#1E3A8A" stroke-width="1.5"/>
  <rect x="60" y="120" width="200" height="28" rx="6" fill="#172554"/>
  <text x="160" y="139" fill="#93C5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">1. MCP CLIENTS</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#E2E8F0">
    <rect x="60" y="164" width="200" height="42" rx="8" fill="#111C33" stroke="#1E293B"/>
    <text x="160" y="190" text-anchor="middle">Claude Code / Desktop</text>

    <rect x="60" y="218" width="200" height="42" rx="8" fill="#111C33" stroke="#1E293B"/>
    <text x="160" y="244" text-anchor="middle">Antigravity IDE (agy)</text>

    <rect x="60" y="272" width="200" height="42" rx="8" fill="#111C33" stroke="#1E293B"/>
    <text x="160" y="298" text-anchor="middle">Cursor / Windsurf</text>

    <rect x="60" y="326" width="200" height="42" rx="8" fill="#111C33" stroke="#1E293B"/>
    <text x="160" y="352" text-anchor="middle">Hermes Agent (VPS)</text>
  </g>

  <line x1="278" y1="247" x2="322" y2="247" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrowCyan)"/>

  <rect x="328" y="104" width="242" height="286" rx="14" fill="#0D1526" stroke="#0284C7" stroke-opacity="0.7" stroke-width="1.5"/>
  <rect x="344" y="120" width="210" height="28" rx="6" fill="#0C4A6E"/>
  <text x="449" y="139" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">2. TRANSPORT &amp; AUTH</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="344" y="166" width="210" height="62" rx="8" fill="#111C33" stroke="#1E293B"/>
    <text x="449" y="191" fill="#F8FAFC" font-size="14" font-weight="700" text-anchor="middle">Local stdio</text>
    <text x="449" y="212" fill="#94A3B8" font-size="12" text-anchor="middle">Clean JSON-RPC (stderr logs)</text>

    <rect x="344" y="240" width="210" height="62" rx="8" fill="#111C33" stroke="#1E293B"/>
    <text x="449" y="265" fill="#F8FAFC" font-size="14" font-weight="700" text-anchor="middle">Streamable HTTP</text>
    <text x="449" y="286" fill="#94A3B8" font-size="12" text-anchor="middle">POST /mcp &amp; GET /healthz</text>

    <rect x="344" y="314" width="210" height="54" rx="8" fill="#06281E" stroke="#059669" stroke-opacity="0.6"/>
    <text x="449" y="337" fill="#6EE7B7" font-size="13" font-weight="700" text-anchor="middle">Bearer Auth Guard</text>
    <text x="449" y="355" fill="#A7F3D0" font-size="11.5" text-anchor="middle">Constant-time token check</text>
  </g>

  <line x1="572" y1="247" x2="616" y2="247" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrowCyan)"/>

  <rect x="622" y="104" width="256" height="286" rx="14" fill="#0D1526" stroke="#7C3AED" stroke-opacity="0.8" stroke-width="1.5"/>
  <rect x="638" y="120" width="224" height="28" rx="6" fill="#3B0764"/>
  <text x="750" y="139" fill="#DDD6FE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">3. GEMINI-WEB-MCP CORE</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="638" y="164" width="224" height="48" rx="8" fill="#111C33" stroke="#1E293B"/>
    <text x="750" y="185" fill="#F8FAFC" font-size="13.5" font-weight="700" text-anchor="middle">Asyncio Tab Lock</text>
    <text x="750" y="203" fill="#94A3B8" font-size="11.5" text-anchor="middle">Race-free sequential execution</text>

    <rect x="638" y="222" width="224" height="48" rx="8" fill="#111C33" stroke="#1E293B"/>
    <text x="750" y="243" fill="#F8FAFC" font-size="13.5" font-weight="700" text-anchor="middle">Patchright Stealth Engine</text>
    <text x="750" y="261" fill="#94A3B8" font-size="11.5" text-anchor="middle">Bypasses Google automation block</text>

    <rect x="638" y="280" width="224" height="48" rx="8" fill="#111C33" stroke="#1E293B"/>
    <text x="750" y="301" fill="#F8FAFC" font-size="13.5" font-weight="700" text-anchor="middle">Multi-Selector Fallback</text>
    <text x="750" y="319" fill="#94A3B8" font-size="11.5" text-anchor="middle">Chat • Model Menu • FileChooser</text>

    <rect x="638" y="338" width="224" height="36" rx="8" fill="#1E1B4B" stroke="#4F46E5" stroke-opacity="0.6"/>
    <text x="750" y="361" fill="#C7D2FE" font-size="12.5" font-weight="700" text-anchor="middle">DOM -&gt; Clean Markdown Walker</text>
  </g>

  <line x1="880" y1="247" x2="924" y2="247" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrowCyan)"/>

  <rect x="930" y="104" width="226" height="286" rx="14" fill="#0D1526" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="946" y="120" width="194" height="28" rx="6" fill="#1E3A8A"/>
  <text x="1043" y="139" fill="#BFDBFE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">4. PERSISTENT RUNTIME</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="946" y="166" width="194" height="64" rx="8" fill="#172554" stroke="#3B82F6" stroke-opacity="0.7"/>
    <text x="1043" y="192" fill="#F8FAFC" font-size="14" font-weight="700" text-anchor="middle">gemini.google.com</text>
    <text x="1043" y="213" fill="#93C5FD" font-size="12" text-anchor="middle">Flash • Thinking • Pro</text>

    <rect x="946" y="242" width="194" height="58" rx="8" fill="#111C33" stroke="#1E293B"/>
    <text x="1043" y="266" fill="#F8FAFC" font-size="13.5" font-weight="700" text-anchor="middle">User Data Profile</text>
    <text x="1043" y="286" fill="#94A3B8" font-size="11.5" text-anchor="middle">Cookies &amp; IndexedDB</text>

    <rect x="946" y="312" width="194" height="58" rx="8" fill="#111C33" stroke="#1E293B"/>
    <text x="1043" y="336" fill="#F8FAFC" font-size="13.5" font-weight="700" text-anchor="middle">Docker Xvfb :99</text>
    <text x="1043" y="356" fill="#94A3B8" font-size="11.5" text-anchor="middle">Headed X11 + noVNC :6080</text>
  </g>
</svg>
